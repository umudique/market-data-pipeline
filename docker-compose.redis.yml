# Optional Redis overlay — only activate if API response caching or
# shared rate-limit state provides measurable operational value.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.redis.yml up

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "300"
