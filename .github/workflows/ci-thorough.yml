name: CI Thorough

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-with-coverage:
    name: Test + Coverage (all)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: pytest with coverage
        run: uv run pytest --cov=src --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+psycopg://market:market@localhost:5432/market_data_test
          CANONICAL_TIMEZONE: UTC

  migration-check:
    name: Migration Drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_data_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Apply migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://market:market@localhost:5432/market_data_migration
      - name: Check for unmigrated model changes
        run: uv run alembic check
        env:
          DATABASE_URL: postgresql+psycopg://market:market@localhost:5432/market_data_migration
